<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 Music Stream</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/player.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <h1>🎵 MusicStream</h1>
      </div>
      <nav>
        <a href="#home" class="nav-link active">🏠 Главная</a>
        <a href="upload.html" class="nav-link">⬆️ Загрузить трек</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-bar">
        <div class="search-container">
          <input type="text" id="searchInput" placeholder="Поиск треков, артистов...">
        </div>
      </header>

      <section class="content">
        <h2>Моя библиотека</h2>
        <div id="tracksGrid" class="tracks-grid">
          <!-- Треки будут загружены динамически -->
        </div>
      </section>
    </main>
  </div>

  <!-- Player -->
  <div class="player-container">
    <div class="player">
      <div class="now-playing">
        <img id="trackCover" src="https://via.placeholder.com/50" alt="Cover">
        <div class="track-info">
          <div id="trackTitle">Выберите трек</div>
          <div id="trackArtist">Unknown</div>
        </div>
      </div>

      <div class="player-controls">
        <button id="prevBtn">⏮️</button>
        <button id="playBtn">▶️</button>
        <button id="nextBtn">⏭️</button>
      </div>

      <div class="progress-container">
        <span id="currentTime">0:00</span>
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <span id="totalTime">0:00</span>
      </div>

      <div class="volume-container">
        <span>🔊</span>
        <input type="range" id="volumeSlider" min="0" max="100" value="70">
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
